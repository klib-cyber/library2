<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩런 교사용 메인보드</title><style>body{margin:0;background:#1749a5;color:white;font-family:'Malgun Gothic',sans-serif;text-align:center;padding:25px}h1{font-size:48px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:30px auto;max-width:1200px}.card{background:white;color:#1749a5;border-radius:18px;padding:30px 10px}.number{font-size:46px;font-weight:bold}.distance{font-size:32px;color:#e76a30}.status{font-size:18px}button,select{font:inherit;padding:13px 18px;margin:7px;border:0;border-radius:12px}button{background:#4ade80;font-weight:bold;cursor:pointer}#stop{background:#ffb5b5}#timer{font-size:36px;font-weight:bold}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><h1>🏃 리딩런 READING RUN · 도서실</h1><div id="timer">제한시간 15:00</div><label>제한시간 <select id="minutes"><option>5</option><option>10</option><option selected>15</option><option>20</option><option>30</option></select>분</label><label>인식 기준 <select id="threshold"><option value="0.7">70%</option><option value="0.8" selected>80%</option><option value="0.9">90%</option></select></label><div><button id="start">🏁 3대 동시 시작</button><button id="stop">⏹ 전체 종료</button></div><div id="message">연결 확인 중...</div><section class="cards"><div class="card"><h2>💻 노트북 1</h2><div class="number" id="c1">0자</div><div class="distance" id="d1">0m</div><div class="status" id="s1">대기</div><button id="next1" type="button">➡️ 1번 다음 연</button></div><div class="card"><h2>💻 노트북 2</h2><div class="number" id="c2">0자</div><div class="distance" id="d2">0m</div><div class="status" id="s2">대기</div><button id="next2" type="button">➡️ 2번 다음 연</button></div><div class="card"><h2>💻 노트북 3</h2><div class="number" id="c3">0자</div><div class="distance" id="d3">0m</div><div class="status" id="s3">대기</div><button id="next3" type="button">➡️ 3번 다음 연</button></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
(()=>{const $=id=>document.getElementById(id),cfg=window.READING_RUN_CONFIG||{};if(!cfg.url||!cfg.anonKey){$('message').textContent='config.js에 Supabase URL과 anon key를 입력하세요';return}const db=window.supabase.createClient(cfg.url,cfg.anonKey);let session='',control=null;const fmt=n=>`${String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,n)%60)).padStart(2,'0')}`;async function refresh(){try{let {data,error}=await db.from('reading_run_control_library').select('*').eq('id',1).single();if(error)throw error;control=data;session=data.session_id;$('minutes').value=String(data.minutes);$('threshold').value=String(data.threshold);if(data.state==='running'){$('timer').textContent=`남은 시간 ${fmt((new Date(data.started_at).getTime()+data.minutes*60000-Date.now())/1000)}`;if(Date.now()>new Date(data.started_at).getTime()+data.minutes*60000){await db.from('reading_run_control_library').update({state:'stopped'}).eq('id',1)}}else $('timer').textContent=data.state==='stopped'?'종료됨':'시작 대기';const res=await db.from('reading_run_lanes_library').select('*').eq('session_id',session);if(res.error)throw res.error;for(let i=1;i<=3;i++){let x=(res.data||[]).find(r=>r.lane===i);$('c'+i).textContent=(x?.characters||0)+'자';$('d'+i).textContent=(x?.meters||0)+'m';$('s'+i).textContent=x?(x.state==='finished'?'종료':x.state==='running'?'진행 중':'준비'):'접속 대기'}$('message').textContent='● 실시간 현황 연결됨 (약 1초 간격)'}catch(e){$('message').textContent='연결 오류: '+e.message}}$('start').onclick=async()=>{if(!confirm('3대의 노트북에서 문서 업로드와 마이크 권한 준비를 마쳤나요?'))return;const id=crypto.randomUUID();const {error}=await db.from('reading_run_control_library').update({session_id:id,state:'running',minutes:Number($('minutes').value),threshold:Number($('threshold').value),started_at:new Date().toISOString()}).eq('id',1);if(error)alert(error.message);else refresh()};$('stop').onclick=async()=>{const {error}=await db.from('reading_run_control_library').update({state:'stopped'}).eq('id',1);if(error)alert(error.message);else refresh()};for(let i=1;i<=3;i++)$('next'+i).onclick=async()=>{if(!control||control.state!=='running'){alert('게임 진행 중에만 사용할 수 있습니다');return}const field='next_'+i;const {error}=await db.from('reading_run_control').update({[field]:Number(control[field]||0)+1}).eq('id',1);if(error)alert(error.message);else refresh()};refresh();setInterval(refresh,1000)})();
</script></body></html>
