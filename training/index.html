<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩런 교사용 메인보드</title><style>body{margin:0;background:#1749a5;color:white;font-family:'Malgun Gothic',sans-serif;text-align:center;padding:25px}h1{font-size:48px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:30px auto;max-width:1200px}.card{background:white;color:#1749a5;border-radius:18px;padding:30px 10px}.number{font-size:46px;font-weight:bold}.distance{font-size:32px;color:#e76a30}.status{font-size:18px}.diag{font-size:15px;line-height:1.6;color:#263b60;text-align:left;margin:12px auto 0;padding:12px;background:#edf3ff;border-radius:10px;min-height:105px;overflow-wrap:anywhere}button,select{font:inherit;padding:13px 18px;margin:7px;border:0;border-radius:12px}button{background:#4ade80;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}#stop{background:#ffb5b5}#timer{font-size:36px;font-weight:bold}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><h1>🏃 리딩런 READING RUN · 도서실</h1><div id="timer">제한시간 15:00</div><label>제한시간 <select id="minutes"><option>5</option><option>10</option><option selected>15</option><option>20</option><option>30</option></select>분</label><label>인식 기준 <select id="threshold"><option value="0.7">70%</option><option value="0.8" selected>80%</option><option value="0.9">90%</option></select></label><div><button id="start">🏁 3대 동시 시작</button><button id="resetAll" style="background:#dbeafe">↩ 전체 준비화면 (문서 유지)</button><button id="stop">⏹ 전체 종료</button></div><div id="message">연결 확인 중...</div><section class="cards"><div class="card"><h2>💻 트랙 1</h2><div class="number" id="c1">0자</div><div class="distance" id="d1">0m</div><div class="status" id="s1">대기</div><div class="diag" id="diag1">진단 정보 대기 중</div><button id="next1" type="button">➡️ 트랙1 다음 연</button></div><div class="card"><h2>💻 트랙 2</h2><div class="number" id="c2">0자</div><div class="distance" id="d2">0m</div><div class="status" id="s2">대기</div><div class="diag" id="diag2">진단 정보 대기 중</div><button id="next2" type="button">➡️ 트랙2 다음 연</button></div><div class="card"><h2>💻 트랙 3</h2><div class="number" id="c3">0자</div><div class="distance" id="d3">0m</div><div class="status" id="s3">대기</div><div class="diag" id="diag3">진단 정보 대기 중</div><button id="next3" type="button">➡️ 트랙3 다음 연</button></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cfg=window.READING_RUN_CONFIG||{};if(!cfg.url||!cfg.anonKey||!window.supabase){$('message').textContent='config.js 또는 Supabase 라이브러리를 확인하세요';return}const db=window.supabase.createClient(cfg.url,cfg.anonKey);let session='',control=null,busy=false,editing=false;const fmt=n=>`${String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,n)%60)).padStart(2,'0')}`;['minutes','threshold'].forEach(k=>$(k).addEventListener('change',()=>{editing=true}));
async function refresh(){try{const {data,error}=await db.from('reading_run_control_library').select('*').eq('id',1).single();if(error)throw error;control=data;session=data.session_id;if(!editing){$('minutes').value=String(data.minutes||15);$('threshold').value=String(data.threshold||.8)}if(data.state==='running'){const remain=(new Date(data.started_at).getTime()+data.minutes*60000-Date.now())/1000;$('timer').textContent=`남은 시간 ${fmt(remain)}`;if(remain<=0){await db.from('reading_run_control_library').update({state:'stopped'}).eq('id',1)}}else $('timer').textContent=data.state==='stopped'?'종료됨':'시작 대기';const res=await db.from('reading_run_lanes_library').select('*').eq('session_id',session);if(res.error)throw res.error;for(let i=1;i<=3;i++){const x=(res.data||[]).find(r=>Number(r.lane)===i);$('c'+i).textContent=(x?.characters||0)+'자';$('d'+i).textContent=(x?.meters||0)+'m';$('s'+i).textContent=x?(x.state==='finished'?'종료':x.state==='running'?'진행 중':'준비'):'접속 대기';
      if(!x){$('diag'+i).textContent='⚪ 이번 회차 접속 기록 없음';continue}
      const age=x.updated_at?Math.max(0,Math.round((Date.now()-new Date(x.updated_at).getTime())/1000)):999;
      const stale=age>5?'🔴 통신 지연 ('+age+'초)':'🟢 연결 ('+age+'초 전)';
      const recognition=x.mic_status||'확인 불가';
      const events=Number(x.speech_events||0);
      const lastHeard=x.heard_preview||'아직 인식된 말 없음';
      const speechAge=x.recognition_at?Math.round((Date.now()-new Date(x.recognition_at).getTime())/1000):null;
      const warn=x.state==='running'&&events===0?'⚠️ 음성 인식 결과 없음 · 마이크 확인 필요':'';
      $('diag'+i).textContent=stale+'\n📖 '+(x.stanza||1)+' / '+(x.stanza_total||'?')+'연 · 일치 '+(x.progress_percent||0)+'%\n🎤 '+recognition+' · 결과 '+events+'회'+(speechAge!==null?' · 최근 '+speechAge+'초 전':'')+'\n🗣 '+lastHeard+(x.recognition_error?'\n⚠️ '+x.recognition_error:'')+(warn?'\n'+warn:'');
      $('diag'+i).style.whiteSpace='pre-line'}$('message').textContent='● 서버 연결됨 · 1초마다 갱신 · 트랙은 학생용에서 선택'}catch(e){$('message').textContent='⚠️ 연결 오류: '+e.message}}
$('start').onclick=async()=>{if(busy)return;if(!confirm('학생용 3대에서 문서를 업로드했나요?'))return;busy=true;$('start').disabled=true;try{const id=crypto.randomUUID();const {data,error}=await db.from('reading_run_control_library').update({session_id:id,state:'running',minutes:Number($('minutes').value),threshold:Number($('threshold').value),started_at:new Date().toISOString()}).eq('id',1).select('session_id').single();if(error)throw error;if(data.session_id!==id)throw Error('새 회차 저장을 확인하지 못했습니다');$('message').textContent='🏁 시작 명령 저장 완료';editing=false;await refresh()}catch(e){alert('시작 실패: '+e.message)}finally{busy=false;$('start').disabled=false}};
$('resetAll').onclick=async()=>{if(!confirm('학생용을 모두 준비화면으로 돌릴까요? 업로드한 문서는 유지됩니다.'))return;try{const {error}=await db.from('reading_run_control_library').update({state:'ready'}).eq('id',1);if(error)throw error;await refresh()}catch(e){alert('초기화 실패: '+e.message)}};
$('stop').onclick=async()=>{try{const {error}=await db.from('reading_run_control_library').update({state:'stopped'}).eq('id',1);if(error)throw error;await refresh()}catch(e){alert('종료 실패: '+e.message)}};
for(let i=1;i<=3;i++)$('next'+i).onclick=async()=>{if(!control||control.state!=='running'){alert('게임 진행 중에만 사용할 수 있습니다');return}const field='next_'+i;try{const {error}=await db.from('reading_run_control_library').update({[field]:Number(control[field]||0)+1}).eq('id',1);if(error)throw error;await refresh()}catch(e){alert('다음 연 명령 실패: '+e.message)}};
refresh();setInterval(refresh,1000)})();
</script></body></html>
