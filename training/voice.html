<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩런 READING RUN</title><style>
*{box-sizing:border-box}body{margin:0;background:#307af0;color:white;font-family:'Malgun Gothic',sans-serif;text-align:center;padding:20px}.wrap{max-width:1050px;margin:auto}h1{font-size:52px;margin:8px}.en{font-size:23px;letter-spacing:4px;font-weight:bold}.track{position:relative;height:115px;background:#f77c56;border-top:9px solid #4ade80;border-bottom:9px solid #174fa9;border-radius:18px;margin:20px 0;overflow:hidden}.track:before{content:'';position:absolute;top:50%;width:100%;left:0;border-top:3px dashed #ffffffaa}.track:after{content:'🏁';position:absolute;right:15px;top:30px;font-size:38px}#runner{position:absolute;top:27px;left:8px;font-size:42px;transition:left .35s}#timer{font-size:32px;font-weight:900}.panel{background:#ffffff25;border-radius:14px;padding:18px;margin:15px 0}label{display:inline-block;margin:8px}select,input,button{font:inherit;padding:10px;border-radius:10px;border:0}button{cursor:pointer;font-weight:bold;margin:5px;background:#ffeb3b;color:#17335c}#start{background:#4ade80;font-size:24px}#text{background:white;color:#333;border-radius:16px;padding:24px;text-align:left;white-space:pre-wrap;line-height:1.8;font-size:clamp(25px,3vw,39px);min-height:220px;overflow-wrap:anywhere}.done{background:#fff200;color:#111}.current{color:#1765dc;text-decoration:underline}#status{min-height:30px;margin:12px;font-weight:bold}#result{background:white;color:#245fc1;border-radius:15px;padding:30px;font-size:26px}#meter{height:12px;width:250px;max-width:90%;background:#ffffff55;margin:10px auto;border-radius:8px;overflow:hidden}#level{background:#4ade80;height:100%;width:0;transition:width .08s}.hidden{display:none!important}#reading{margin-top:12px}.info{font-size:21px;font-weight:bold;margin:12px}#settings{margin-top:20px}.muted{font-size:14px}#manual{margin-top:12px}@media(max-width:650px){h1{font-size:36px}.track{height:90px}#runner{top:16px}#text{padding:16px}}
</style></head><body><main class="wrap"><h1>리딩런 · 연수실</h1><div class="en">READING RUN</div><div id="timer">제한시간 15:00</div><div class="track" id="track"><div id="runner">🏃‍♂️💨</div></div><div id="settings" class="panel"><label>제한시간 <select id="minutes"><option value="5">5분</option><option value="10">10분</option><option value="15" selected>15분</option><option value="20">20분</option><option value="30">30분</option></select></label><label>인식 기준 <select id="threshold"><option value="0.7">너그럽게 70%</option><option value="0.8" selected>보통 80%</option><option value="0.9">엄격하게 90%</option></select></label><label>읽을 문서 <input id="file" type="file" accept=".hwpx,.txt"></label><div class="muted">HWPX 또는 TXT 파일을 불러오세요. 빈 줄을 기준으로 연이 나뉩니다.</div></div><button id="start">🏁 게임 시작</button><section id="reading" class="hidden"><div class="info" id="paraInfo"></div><div id="text"></div><div id="status">🎤 마이크 준비 중</div><div id="meter"><div id="level"></div></div><div id="manual"><button id="next">➡️ 다음 연 (수동)</button><button id="retry">↩️ 이 연 다시 읽기</button><button id="mic">🎤 마이크 다시 켜기</button></div></section><section id="result" class="hidden"></section><button id="reset" class="hidden">🔄 새 게임</button></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),lane=Math.max(1,Math.min(3,Number(params.get('lane'))||1));let paras=[],index=0,matched=0,total=0,running=false,ended=false,recognition=null,recognizing=false,deadline=0,clock=null,heartbeat=null,audioCtx=null,stream=null,analyser=null,anim=null,session=null,client=null,lastTranscript='',lastSend=0,launching=false,lastRemoteNext=0,seenSession='';const cfg=window.READING_RUN_CONFIG||{};if(cfg.url&&cfg.anonKey&&window.supabase){client=window.supabase.createClient(cfg.url,cfg.anonKey)}const clean=s=>String(s||'').normalize('NFC').replace(/[^가-힣a-zA-Z0-9]/g,'').toLowerCase();const chars=s=>[...clean(s)].length;const time=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,s)%60)).padStart(2,'0')}`;function status(s){$('status').textContent=s}function display(){let p=paras[index]||'',c=[...p],count=0;$('paraInfo').textContent=`${index+1} / ${paras.length} 연 · 읽은 글자 ${total+matched}자 · ${(total+matched)*10}m`;$('text').replaceChildren();for(let ch of c){let span=document.createElement('span');span.textContent=ch;if(clean(ch)){if(count<matched)span.className='done';else if(count===matched)span.className='current';count++}$('text').append(span)}const fraction=Math.min(1,(total+matched)/Math.max(1,paras.reduce((a,p)=>a+chars(p),0)));$('runner').style.left=`calc(${fraction*88}% + 8px)`}function score(p,heard){let a=[...clean(p)],b=[...clean(heard)];if(!a.length||!b.length)return 0;let j=0;for(let i=0;i<b.length&&j<a.length;i++){if(b[i]===a[j])j++;else{let k=a.slice(j+1,j+4).indexOf(b[i]);if(k>=0)j+=k+2}}return Math.min(a.length,j)}function sync(force=false){if(!client||!session)return;let now=Date.now();if(!force&&now-lastSend<350)return;lastSend=now;client.from('reading_run_lanes_training').upsert({session_id:session,lane,characters:total+matched,meters:(total+matched)*10,stanza:index+1,state:ended?'finished':running?'running':'ready',updated_at:new Date().toISOString()},{onConflict:'session_id,lane'}).then(({error})=>{if(error)console.warn('sync',error.message)})}function stopRecognition(){if(recognition){recognition.onend=null;try{recognition.abort()}catch(e){}recognition=null}recognizing=false}function next(){if(ended)return;total+=matched;index++;matched=0;lastTranscript='';if(index>=paras.length){finish('모든 연을 읽었습니다!');return}display();status('🎤 다음 연을 읽어 주세요');sync(true);restartRecognition()}function restartRecognition(){stopRecognition();if(running)setTimeout(startRecognition,120)}function startRecognition(){if(!running||ended||recognizing)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status('⚠️ 이 브라우저는 음성인식을 지원하지 않습니다. Chrome을 사용해 주세요.');return}recognition=new SR();recognition.lang='ko-KR';recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=1;recognition.onstart=()=>{recognizing=true;status('🎤 인식 중 · 문장을 읽어 주세요')};recognition.onerror=e=>{recognizing=false;status(e.error==='not-allowed'?'⚠️ 마이크 권한을 허용해 주세요.':'⚠️ 음성이 인식되지 않습니다 · 마이크 다시 켜기를 눌러 주세요')};recognition.onend=()=>{recognizing=false;if(running&&!ended)setTimeout(startRecognition,300)};recognition.onresult=e=>{let heard='';for(let i=0;i<e.results.length;i++)heard+=e.results[i][0].transcript+' ';lastTranscript=heard;let candidate=score(paras[index],heard);if(candidate>matched){matched=candidate;display();sync()}let needed=Math.ceil(chars(paras[index])*Number($('threshold').value));if(matched>=needed&&matched>0){status('✅ 연 읽기 완료!');next()}else status(`🎤 음성 인식 중 · ${Math.round(100*matched/Math.max(1,chars(paras[index])))}% 일치`)};try{recognition.start()}catch(e){status('⚠️ 마이크를 시작하지 못했습니다')}}async function micMeter(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();const source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=512;source.connect(analyser);let data=new Uint8Array(analyser.frequencyBinCount);const tick=()=>{if(!running)return;analyser.getByteTimeDomainData(data);let sum=0;for(let v of data)sum+=((v-128)/128)**2;$('level').style.width=`${Math.min(100,Math.sqrt(sum/data.length)*360)}%`;anim=requestAnimationFrame(tick)};tick()}catch(e){status('⚠️ 마이크 권한이 필요합니다')}}function stopMeter(){if(anim)cancelAnimationFrame(anim);if(stream)stream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close();stream=null;audioCtx=null}function finish(reason){if(ended)return;ended=true;running=false;clearInterval(clock);stopRecognition();stopMeter();$('reading').classList.add('hidden');$('result').classList.remove('hidden');$('result').textContent=`🏁 ${reason} 총 ${total+matched}글자 · ${(total+matched)*10}m 달렸습니다!`;$('reset').classList.remove('hidden');sync(true)}async function begin(remote=false){if(running||launching)return;if(!paras.length){alert('먼저 HWPX 또는 TXT 문서를 업로드해 주세요.');return}launching=true;try{if(client&&!session){const {data,error}=await client.from('reading_run_control_training').select('*').eq('id',1).single();if(error)throw error;session=data.session_id}index=0;matched=0;total=0;ended=false;running=true;$('settings').classList.add('hidden');$('start').classList.add('hidden');$('result').classList.add('hidden');$('reading').classList.remove('hidden');$('reset').classList.add('hidden');let secs=Number($('minutes').value)*60;deadline=remote&&client&&window.__roomStartTime?window.__roomStartTime+secs*1000:Date.now()+secs*1000;display();$('timer').textContent=`남은 시간 ${time(secs)}`;clearInterval(clock);clock=setInterval(()=>{let remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=`남은 시간 ${time(remain)}`;if(remain<=0)finish('제한시간 종료!')},200);micMeter();startRecognition();sync(true)}catch(e){alert('시작 오류: '+e.message)}finally{launching=false}}async function loadFile(file){if(!file)return;try{let raw='';if(file.name.toLowerCase().endsWith('.txt'))raw=await file.text();else if(file.name.toLowerCase().endsWith('.hwpx')){if(!window.JSZip)throw Error('HWPX 처리 라이브러리를 불러오지 못했습니다');const zip=await JSZip.loadAsync(file);let paths=Object.keys(zip.files).filter(n=>/^Contents\/section\d+\.xml$/i.test(n)).sort((a,b)=>Number(a.match(/section(\d+)/i)[1])-Number(b.match(/section(\d+)/i)[1]));if(!paths.length)throw Error('HWPX 본문을 찾지 못했습니다');let parts=[];for(const path of paths){let xml=new DOMParser().parseFromString(await zip.file(path).async('string'),'application/xml');let ps=[...xml.getElementsByTagName('*')].filter(x=>x.localName==='p');for(let p of ps){let t=[...p.getElementsByTagName('*')].filter(x=>x.localName==='t').map(x=>x.textContent).join('');parts.push(t)}parts.push('')}raw=parts.join('\n')}else throw Error('.hwpx 또는 .txt 파일만 지원합니다');paras=raw.replace(/\r/g,'').split(/\n\s*\n+/).map(x=>x.trim()).filter(x=>chars(x)>0);if(!paras.length)throw Error('읽을 문장을 찾지 못했습니다');status(`${paras.length}개 연을 불러왔습니다`);$('start').textContent=`🏁 게임 시작 (${paras.length}연)`;alert(`${paras.length}개 연을 불러왔습니다.`)}catch(e){alert('파일 불러오기 실패: '+e.message)}}$('file').addEventListener('change',e=>loadFile(e.target.files[0]));$('start').onclick=()=>begin();$('next').onclick=next;$('retry').onclick=()=>{matched=0;lastTranscript='';display();sync(true);restartRecognition()};$('mic').onclick=restartRecognition;$('reset').onclick=()=>location.reload();$('minutes').onchange=()=>{$('timer').textContent=`제한시간 ${time(Number($('minutes').value)*60)}`};async function poll(){if(!client)return;try{const {data,error}=await client.from('reading_run_control_training').select('*').eq('id',1).single();if(error||!data)return;if(data.session_id!==session){session=data.session_id;lastRemoteNext=Number(data['next_'+lane]||0);if(running)finish('새 회차로 변경되었습니다');if(!running&&!ended&&data.state!=='running')sync(true)}if(data.state==='running'&&!running&&!ended){$('minutes').value=String(data.minutes||15);$('threshold').value=String(data.threshold||.8);window.__roomStartTime=new Date(data.started_at).getTime();await begin(true)}const remoteNext=Number(data['next_'+lane]||0);if(remoteNext>lastRemoteNext){if(running&&!ended)next();lastRemoteNext=remoteNext}if(data.state==='stopped'&&running)finish('교사용 메인보드에서 종료했습니다')}catch(e){console.warn(e)}}if(client){poll();heartbeat=setInterval(()=>{poll();if(running)sync()},1000)}else status('단독 실행 모드 · 실시간 메인보드 연결은 config.js 설정 필요');})();
</script></body></html>
